[package]
name = "hm220"
version = "0.1.0"
edition = "2021"
description = "Hawk HM220 fare protokolü ve HID erişimi (Linux hidraw, Windows hidapi)"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[[bin]]
name = "hawk-hm220"
path = "src/bin/hawk-hm220.rs"
required-features = ["cli"]
